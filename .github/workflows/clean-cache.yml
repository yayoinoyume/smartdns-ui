name: Clear Cache

on:
  schedule:
    - cron: '0 0 * * *' # Runs once a day (https://crontab.guru/once-a-day)
  workflow_dispatch:

# 清理缓存与删除旧运行都需要 actions: write。
# 改用内置的 github.token，不再依赖从未配置过的 secrets.TOKEN。
permissions:
  actions: write
  contents: read

jobs:
  clear:
    name: Clear cache
    runs-on: ubuntu-latest
    steps:
    - name: Clear cache
      uses: MyAlbum/purge-cache@v2
      with:
        max-age: 86400 
        token: ${{ github.token }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7